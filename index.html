<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos</title>
    <!-- Tailwind CSS (CDN for Vanilla HTML prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white font-sans overflow-hidden antialiased selection:bg-red-500">
    
    <!-- Initial Persona Style Date Transition Overlay -->
    <div id="date-transition" class="fixed inset-0 z-50 flex items-center justify-center bg-black pointer-events-none">
        <h1 id="transition-text" class="font-bebas text-8xl md:text-9xl tracking-wider text-white transform scale-150 opacity-0"></h1>
    </div>

    <!-- Main Container -->
    <main class="h-screen w-screen flex relative overflow-hidden">
        
        <!-- Content Area -->
        <div class="flex-1 flex flex-col p-6 h-full relative z-10" id="main-content">
            
            <!-- Up Next / D-Day Widget -->
            <header class="mb-8 mt-4 relative">
                <div class="absolute -left-6 top-0 w-1 h-full bg-red-500"></div>
                <span class="text-red-500 font-bold tracking-widest uppercase text-xs mb-1 block">Next Objective</span>
                <h2 id="next-task-title" class="text-3xl font-bold leading-tight mb-1 truncate text-white">SYSTEM BOOT</h2>
                
                <!-- Countdown in Seconds -->
                <div class="font-bebas text-7xl text-yellow-400 tracking-wider shadow-yellow" id="countdown-timer">
                    00:00:00
                </div>
            </header>

            <!-- Dynamic Views -->
            <section id="view-schedule" class="flex-1 overflow-y-auto pb-20 no-scrollbar view-section active">
                <div class="flex justify-between items-end mb-4 border-b border-gray-800 pb-2">
                    <h3 class="text-xl font-bold uppercase tracking-wide">Timeline</h3>
                    <button id="btn-add" class="text-blue-400 hover:text-blue-300 transition-colors uppercase text-sm font-bold tracking-wider">+ ADD</button>
                </div>
                <ul id="task-list" class="space-y-3">
                    <!-- Tasks injected by JS -->
                </ul>
            </section>
            
            <section id="view-info" class="flex-1 overflow-y-auto pb-20 no-scrollbar view-section hidden">
                <h3 class="text-xl font-bold uppercase mb-4 border-b border-gray-800 pb-2 tracking-wide">Intelligence</h3>
                
                <!-- Short-term / Long-term structure -->
                <div class="space-y-4">
                    <div class="p-4 bg-gray-900 rounded-lg border-l-4 border-blue-500 shadow-md relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-2 text-gray-700 text-xs font-bold uppercase">This Month</div>
                        <p class="text-xs text-blue-400 uppercase tracking-widest mb-1">Short-Term Target</p>
                        <p class="font-bold text-lg">Deploy MVP to Vercel</p>
                    </div>
                    
                    <div class="p-4 bg-gray-900 rounded-lg border-l-4 border-purple-500 shadow-md relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-2 text-gray-700 text-xs font-bold uppercase">This Year</div>
                        <p class="text-xs text-purple-400 uppercase tracking-widest mb-1">Long-Term Target</p>
                        <p class="font-bold text-lg">Automate Daily Workflows</p>
                    </div>
                </div>
            </section>

            <section id="view-urls" class="flex-1 overflow-y-auto pb-20 no-scrollbar view-section hidden">
                <h3 class="text-xl font-bold uppercase mb-4 border-b border-gray-800 pb-2 tracking-wide">Network</h3>
                <div class="space-y-2">
                    <a href="#" class="block p-4 bg-gray-900 rounded border-l-4 border-yellow-500 hover:bg-gray-800 transition-colors shadow-md relative group">
                        <span class="text-xs text-yellow-500 block mb-1 font-bold uppercase tracking-wider">Repository</span>
                        <span class="truncate block w-[90%] font-mono text-sm text-gray-300">github.com/donghyun/chronos</span>
                    </a>
                </div>
            </section>

        </div>

        <!-- Right Edge Tabs (Bookmark Style) -->
        <nav class="w-16 h-full bg-gray-950 border-l border-gray-900 flex flex-col justify-center z-20 shadow-2xl relative shrink-0">
            <div class="flex flex-col gap-12 items-center h-full justify-center w-full">
                <!-- Red Tab -->
                <button class="nav-btn active group relative" data-target="view-schedule">
                    <span class="vertical-text uppercase tracking-widest text-xs font-bold text-gray-500 group-hover:text-red-500 transition-colors">Schedule</span>
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 h-16 w-1 bg-red-500 indicator transition-all duration-300"></div>
                </button>
                <!-- Blue Tab -->
                <button class="nav-btn group relative" data-target="view-info">
                    <span class="vertical-text uppercase tracking-widest text-xs font-bold text-gray-500 group-hover:text-blue-500 transition-colors">Info</span>
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 h-16 w-1 bg-blue-500 opacity-0 indicator transition-all duration-300 scale-y-0"></div>
                </button>
                <!-- Yellow Tab -->
                <button class="nav-btn group relative" data-target="view-urls">
                    <span class="vertical-text uppercase tracking-widest text-xs font-bold text-gray-500 group-hover:text-yellow-500 transition-colors">Network</span>
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 h-16 w-1 bg-yellow-500 opacity-0 indicator transition-all duration-300 scale-y-0"></div>
                </button>
            </div>
        </nav>

    </main>

    <!-- Quick Add Modal (Keyboard & Mobile optimized) -->
    <div id="add-modal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="w-[90%] max-w-md bg-gray-900 border border-gray-800 p-6 shadow-2xl relative overflow-hidden rounded-lg">
            <div class="absolute top-0 left-0 w-full h-1 bg-red-500"></div>
            <h2 class="text-xl font-bold uppercase mb-6 text-white tracking-wide">New Objective</h2>
            
            <div class="space-y-4">
                <input type="text" id="input-task" placeholder="Task Name (e.g., Sync API)" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-white outline-none focus:border-red-500 transition-colors placeholder-gray-600 text-sm">
                
                <input type="datetime-local" id="input-time" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-white outline-none focus:border-red-500 transition-colors text-sm">
            </div>

            <div class="flex justify-end gap-3 mt-8">
                <button id="btn-cancel" class="text-gray-500 uppercase text-xs font-bold tracking-wider hover:text-white px-4 py-2">Abort</button>
                <button id="btn-save" class="bg-red-600 text-white uppercase text-xs font-bold tracking-wider hover:bg-red-500 px-6 py-2 rounded transition-colors shadow-lg shadow-red-500/20">Engage</button>
            </div>
        </div>
    </div>

    <!-- ES Module Entry -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
